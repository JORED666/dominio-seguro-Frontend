server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # El navegador solo habla con este origen: /api se reenvía al backend (cookie de refresco same-origin).
  # Aquí no se añaden cabeceras de seguridad: ya las pone helmet en el backend.
  resolver 127.0.0.11 valid=10s;
  location /api/ {
    set $api http://backend:3001;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Archivos con hash en el nombre: caché larga
  location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
    expires 1y;
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # Rutas de Angular: siempre devolver index.html, sin caché
  location / {
    expires -1;
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
