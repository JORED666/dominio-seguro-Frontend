<header class="barra">
  <a class="logo" routerLink="/dominios">Dominio Seguro</a>
  @if (auth.autenticado()) {
    <nav>
      <a routerLink="/dominios" routerLinkActive="activo">Mis dominios</a>
    </nav>
    <div class="usuario">
      <span>{{ auth.usuario()?.nombre }}</span>
      <button class="btn secundario" type="button" (click)="auth.cerrarSesion()">Cerrar sesión</button>
    </div>
  }
</header>

<main class="contenedor">
  <router-outlet />
</main>
